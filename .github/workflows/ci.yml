name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain comes from rust-toolchain.toml, never from the runner:
      # whatever stable happens to be preinstalled is not what we gate on.
      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel/ {print $2; exit}' rust-toolchain.toml)"
          rustup set profile minimal
          rustup toolchain install "$channel" --component clippy --component rustfmt
          rustup default "$channel"
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets
