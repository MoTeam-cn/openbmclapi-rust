name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag is the source of truth for the version, so the manifest is rewritten
  # from it before anything is built, and the result is committed back to the
  # default branch. That write-back is why a working copy should be pulled before
  # it commits anything.
  sync-version:
    name: sync the manifest version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sync.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync Version
        id: sync
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk -F'"' '/^version/ {print $2; exit}' Cargo.toml)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          current="$(awk -F'"' '/^version/ {print $2; exit}' Cargo.toml)"
          echo "manifest says ${current}, target is ${version}"
          if [ "${current}" = "${version}" ]; then
            echo "already in sync, nothing to commit"
            exit 0
          fi
          sed -i "0,/^version = \".*\"/s//version = \"${version}\"/" Cargo.toml
          # The lockfile records the workspace member's version too and the build
          # uses --locked, so it has to move with the manifest.
          cargo metadata --format-version 1 >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release ${version}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

  build:
    name: ${{ matrix.linkage }} ${{ matrix.target }}
    needs: sync-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Self-contained: nothing beyond the kernel at run time.
          - target: x86_64-unknown-linux-musl
            linkage: static
          # Smaller, but needs a glibc at least as new as the runner's.
          - target: x86_64-unknown-linux-gnu
            linkage: dynamic
    steps:
      - uses: actions/checkout@v7

      # Provision the toolchain from rust-toolchain.toml; the runner's own rustc
      # is never used.
      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel/ {print $2; exit}' rust-toolchain.toml)"
          rustup set profile minimal
          rustup toolchain install "$channel"
          rustup default "$channel"
          rustup target add "${{ matrix.target }}"
          rustc --version
          cargo --version

      # zstd-sys is the only C dependency, and the musl target needs its own
      # compiler rather than the host's.
      - name: Install the C toolchain
        if: matrix.linkage == 'static'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Sync the manifest version
        run: |
          set -euo pipefail
          sed -i "0,/^version = \".*\"/s//version = \"${{ needs.sync-version.outputs.version }}\"/" Cargo.toml
          cargo metadata --format-version 1 >/dev/null
          grep '^version' Cargo.toml

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          version="${{ needs.sync-version.outputs.version }}"
          name="openbmclapi-${version}-${{ matrix.target }}-${{ matrix.linkage }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/openbmclapi" "dist/$name/"
          cp README.md LICENSE NOTICE "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          ls -lh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.linkage }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: [sync-version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The body is a hand-written download table followed by the changelog
      # GitHub generates from the commits since the previous release.
      - name: Write the release notes
        run: |
          set -euo pipefail
          version="${{ needs.sync-version.outputs.version }}"
          cat > notes.md <<'NOTES'
          ## 下载

          | 包 | 说明 |
          | --- | --- |
          | `openbmclapi-<版本>-x86_64-unknown-linux-musl-static.tar.gz` | 静态链接，除内核外无依赖 |
          | `openbmclapi-<版本>-x86_64-unknown-linux-gnu-dynamic.tar.gz` | 动态链接，需要 glibc ≥ 构建机 |

          解压后：

          ```bash
          ./openbmclapi init     # 生成 config.yaml，每一项都有注释
          ./openbmclapi          # 启动
          ```

          每个包都附 `.sha256`。

          ---

          NOTES
          sed -i "s/<版本>/${version}/g" notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes dist/*.tar.gz dist/*.sha256
          fi
          gh release view "$tag" --json body -q .body > generated.md
          cat notes.md generated.md > combined.md
          gh release edit "$tag" --notes-file combined.md
