name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag is the source of truth for the version, so the manifest is rewritten
  # from it before anything is built, and the result is committed back to the
  # default branch. That write-back is why a working copy should be pulled before
  # it commits anything.
  sync-version:
    name: sync the manifest version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sync.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync Version
        id: sync
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk -F'"' '/^version/ {print $2; exit}' Cargo.toml)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          current="$(awk -F'"' '/^version/ {print $2; exit}' Cargo.toml)"
          echo "manifest says ${current}, target is ${version}"
          if [ "${current}" = "${version}" ]; then
            echo "already in sync, nothing to commit"
            exit 0
          fi
          sed -i "0,/^version = \".*\"/s//version = \"${version}\"/" Cargo.toml
          # The lockfile records the workspace member's version too and the build
          # uses --locked, so it has to move with the manifest.
          cargo metadata --format-version 1 >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release ${version}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

  build:
    name: ${{ matrix.label }}
    needs: sync-version
    runs-on: ${{ matrix.os }}
    # Windows defaults to pwsh, and every step here is a bash script.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux, self-contained: nothing beyond the kernel at run time.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            label: linux-x86_64-musl-static
            musl: true
          # Linux, smaller but needs a glibc at least as new as the runner's.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            label: linux-x86_64-gnu-dynamic
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            label: windows-x86_64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            label: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            label: macos-aarch64
    steps:
      - uses: actions/checkout@v7

      # Provision the toolchain from rust-toolchain.toml; the runner's own rustc
      # is never used.
      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel/ {print $2; exit}' rust-toolchain.toml)"
          rustup set profile minimal
          rustup toolchain install "$channel"
          rustup default "$channel"
          rustup target add "${{ matrix.target }}"
          rustc --version
          cargo --version

      # zstd-sys is the only C dependency, and the musl target needs its own
      # compiler rather than the host's.
      - name: Install the C toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # Rewritten per job because the tag's commit predates the sync commit.
      # awk rather than sed: BSD sed on macOS does not take -i the GNU way.
      - name: Sync the manifest version
        run: |
          set -euo pipefail
          awk -v v="${{ needs.sync-version.outputs.version }}" '
            !done && /^version = "/ { sub(/"[^"]*"/, "\"" v "\""); done = 1 }
            { print }
          ' Cargo.toml > Cargo.toml.new
          mv Cargo.toml.new Cargo.toml
          cargo metadata --format-version 1 >/dev/null
          grep '^version' Cargo.toml

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          version="${{ needs.sync-version.outputs.version }}"
          name="openbmclapi-${version}-${{ matrix.label }}"
          bin="target/${{ matrix.target }}/release/openbmclapi"
          if [ -f "${bin}.exe" ]; then
            bin="${bin}.exe"
          fi
          mkdir -p "dist/$name"
          cp "$bin" "dist/$name/"
          cp README.md LICENSE NOTICE "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          # macOS ships shasum, not sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          ls -lh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: [sync-version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # Full history so the previous tag can be found for the compare link.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          previous="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [ -n "${previous}" ]; then
            changes="https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${tag}"
          else
            changes="https://github.com/${GITHUB_REPOSITORY}/commits/${tag}"
          fi
          cat > notes.md <<'NOTES'
          linux-x86_64-musl-static：静态链接，不依赖系统库
          linux-x86_64-gnu-dynamic：动态链接，需要 glibc
          windows-x86_64 / macos-x86_64 / macos-aarch64

          解压后 ./openbmclapi init 生成配置，再 ./openbmclapi 启动。

          改动：
          NOTES
          echo "${changes}" >> notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.sha256 --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md \
              dist/*.tar.gz dist/*.sha256
          fi