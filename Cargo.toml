[package]
name = "openbmclapi"
version = "0.1.0-rc.4"
edition = "2021"
rust-version = "1.82"
description = "bmclapi@home - Rust implementation of the OpenBMCLAPI cluster agent"
license = "Apache-2.0"
default-run = "openbmclapi"

[[bin]]
name = "openbmclapi"
path = "src/main.rs"

[lib]
name = "openbmclapi"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"
axum = { version = "0.8", features = ["http2", "json", "query"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
# ring only: the default provider is aws-lc-rs, whose CMake build makes a
# static musl release impractical. install_crypto_provider() uses ring anyway.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
zstd = "0.13"
sha1 = "0.10"
md5 = "0.7"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
form_urlencoded = "1"
percent-encoding = "2"
regex = "1"
rand = "0.8"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
thiserror = "2"
anyhow = "1"
chrono = "0.4"
ipnet = "2"
mime_guess = "2"
quick-xml = "0.41"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
